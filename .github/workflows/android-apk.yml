# Build debug APKs for lan (HTTP) / staging / production (HTTPS).
# Each GitHub Environment (lan, staging, production) must define:
#   REFLEX_BACKEND_URL  — e.g. http://192.168.1.56:8001 or https://api.example.com

name: Android APK

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Build target (lan / staging / production / all)"
        type: choice
        required: true
        default: lan
        options:
          - lan
          - staging
          - production
          - all
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install deps
        run: |
          uv sync
          uv pip install -e ".[dev]"

      - name: pytest
        run: uv run pytest tests/ -q

  setup-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target_env }}" = "all" ]; then
            MATRIX='{"target_env":["lan","staging","production"]}'
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX="{\"target_env\":[\"${{ inputs.target_env }}\"]}"
          else
            MATRIX='{"target_env":["lan"]}'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $MATRIX"

  build-apk:
    name: APK (${{ matrix.target_env }})
    needs: [test, setup-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    environment: ${{ matrix.target_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Python deps
        run: |
          uv sync
          uv pip install -e .

      - name: Resolve backend URL from Environment secret
        id: backend
        env:
          BACKEND_URL: ${{ secrets.REFLEX_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::REFLEX_BACKEND_URL is not set on GitHub Environment '${{ matrix.target_env }}'."
            echo "Repo Settings → Environments → ${{ matrix.target_env }} → Environment secrets"
            exit 1
          fi
          BACKEND_URL="${BACKEND_URL%/}"
          echo "url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          if [[ "$BACKEND_URL" == http://* ]]; then
            echo "scheme=http" >> "$GITHUB_OUTPUT"
          elif [[ "$BACKEND_URL" == https://* ]]; then
            echo "scheme=https" >> "$GITHUB_OUTPUT"
          else
            echo "::error::REFLEX_BACKEND_URL must start with http:// or https:// (got: $BACKEND_URL)"
            exit 1
          fi
          echo "Baking backend: $BACKEND_URL"

      - name: Scaffold Capacitor + Android
        run: uv run reflex-capacitor init --platform android

      - name: Export frontend & cap sync
        env:
          REFLEX_CAPACITOR_DEV_BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: uv run reflex-capacitor sync

      - name: Force Android cleartext for http backend
        if: steps.backend.outputs.scheme == 'http'
        run: |
          uv run python -c "
          from pathlib import Path
          from reflex_base.config import get_config
          from reflex_capacitor.plugin import CapacitorPlugin
          plugin = next(p for p in get_config().plugins if isinstance(p, CapacitorPlugin))
          plugin.ensure_android_cleartext(Path('capacitor').resolve())
          "

      - name: Verify baked backend & Capacitor server settings
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
          SCHEME: ${{ steps.backend.outputs.scheme }}
        run: |
          set -euo pipefail
          echo "== capacitor.config.json =="
          cat capacitor/capacitor.config.json
          echo
          echo "== reflex-env (baked URLs) =="
          ENV_JS=$(ls capacitor/www/assets/reflex-env-*.js | head -n1)
          echo "file: $ENV_JS"
          cat "$ENV_JS"
          echo

          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          backend = os.environ["BACKEND_URL"]
          scheme = os.environ["SCHEME"]
          conf = json.loads(Path("capacitor/capacitor.config.json").read_text())
          env_js = next(Path("capacitor/www/assets").glob("reflex-env-*.js")).read_text()
          index_html = Path("capacitor/www/index.html").read_text()

          if backend not in env_js:
              sys.exit(f"backend URL not found in env js: {backend}")

          host = backend.split("://", 1)[1]

          if scheme == "http":
              if f"ws://{host}/_event" not in env_js:
                  sys.exit(f"missing ws://{host}/_event in baked env")
              if conf.get("server", {}).get("cleartext") is not True:
                  sys.exit("expected server.cleartext=true for http backend")
              if conf.get("server", {}).get("androidScheme") != "http":
                  sys.exit("expected androidScheme=http for http backend")
              manifest = Path("capacitor/android/app/src/main/AndroidManifest.xml").read_text()
              if 'usesCleartextTraffic="true"' not in manifest:
                  sys.exit("expected usesCleartextTraffic=true in AndroidManifest")
              print("OK: http backend — cleartext + androidScheme http + ws:// event")
          else:
              if f"wss://{host}/_event" not in env_js:
                  sys.exit(f"missing wss://{host}/_event in baked env")
              if conf.get("server", {}).get("androidScheme") != "https":
                  sys.exit("expected androidScheme=https for https backend")
              if conf.get("server", {}).get("cleartext") is True:
                  sys.exit("cleartext must not be true for https backend")
              print("OK: https backend — androidScheme https + wss:// event")

          if "<!-- reflex-capacitor bridge begin -->" not in index_html:
              sys.exit("bridge scripts not injected into index.html")
          print("OK: bridge injected")
          PY

      - name: Assemble debug APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ matrix.target_env }}
          path: capacitor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
