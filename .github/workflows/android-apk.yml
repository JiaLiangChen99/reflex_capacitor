# Build a debug APK for LAN testing.
# Backend URL is hardcoded for now so we can verify cleartext HTTP works on device.
# (Environment secret REFLEX_BACKEND_URL can be restored later.)

name: Android APK

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Label for the artifact (lan / staging / production)"
        type: choice
        required: true
        default: lan
        options:
          - lan
          - staging
          - production
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.event.inputs.target_env || 'lan' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: APK (${{ github.event.inputs.target_env || 'lan' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Python deps
        run: |
          uv sync
          uv pip install -e .

      - name: Set hardcoded LAN backend URL
        id: backend
        run: |
          # Temporary hardcode for device LAN testing.
          URL="http://192.168.1.56:8001"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Baking backend: $URL"

      - name: Scaffold Capacitor + Android
        run: uv run reflex-capacitor init --platform android

      - name: Export frontend & cap sync
        env:
          REFLEX_CAPACITOR_DEV_BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: uv run reflex-capacitor sync

      - name: Force Android cleartext for http backend
        run: |
          uv run python -c "
          from pathlib import Path
          from reflex_base.config import get_config
          from reflex_capacitor.plugin import CapacitorPlugin
          plugin = next(p for p in get_config().plugins if isinstance(p, CapacitorPlugin))
          plugin.ensure_android_cleartext(Path('capacitor').resolve())
          "

      - name: Verify baked backend + cleartext
        run: |
          set -e
          echo "== capacitor.config.json =="
          cat capacitor/capacitor.config.json
          echo
          echo "== reflex-env (baked URLs) =="
          ENV_JS=$(ls capacitor/www/assets/reflex-env-*.js | head -n1)
          echo "file: $ENV_JS"
          cat "$ENV_JS"
          echo
          grep -q '192.168.1.56:8001' "$ENV_JS"
          grep -q '"cleartext": true' capacitor/capacitor.config.json
          echo "== AndroidManifest cleartext =="
          grep -n 'usesCleartextTraffic\|INTERNET' capacitor/android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' capacitor/android/app/src/main/AndroidManifest.xml
          echo "OK: backend URL baked and cleartext enabled"

      - name: Assemble debug APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.event.inputs.target_env || 'lan' }}
          path: capacitor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
