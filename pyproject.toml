[project]
name = "reflex-capacitor"
version = "0.2.0"
description = "Package a Reflex app as a Capacitor mobile app (remote backend)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["reflex", "capacitor", "mobile", "android", "ios", "packaging"]
dependencies = [
    "reflex>=0.9.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
reflex-capacitor = "reflex_capacitor.cli:main"

[project.urls]
Documentation = "docs/README.md"
Changelog = "CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reflex_capacitor"]

[tool.hatch.build.targets.wheel.force-include]
"src/reflex_capacitor/bridge/assets" = "reflex_capacitor/bridge/assets"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/reflex_capacitor",
    "docs/README.md",
    "docs/guide/00-getting-started.md",
    "docs/guide/install.md",
    "docs/guide/faq.md",
    "docs/guide/cli.md",
    "docs/guide/configuration.md",
    "docs/guide/android-build.md",
    "docs/guide/02-native-bridge.md",
    "docs/guide/dev-reload.md",
    "docs/guide/debug.md",
    "docs/guide/publishing.md",
    "docs/guide/ci.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "integration: offline L1 integration tests (temp scaffold, no adb/npm network)",
    "device: requires adb-connected Android device or emulator (future smoke tests)",
]
testpaths = ["tests"]
pythonpath = ["tests"]
