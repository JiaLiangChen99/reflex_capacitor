[project]
name = "reflex-capacitor"
version = "0.1.0"
description = "Package a Reflex app as a Capacitor mobile app (remote backend)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["reflex", "capacitor", "mobile", "android", "ios", "packaging"]
dependencies = [
    "reflex>=0.9.0",
    "click>=8.1.0",
]

[project.scripts]
reflex-capacitor = "reflex_capacitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reflex_capacitor"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/reflex_capacitor",
    "docs",
    "README.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
